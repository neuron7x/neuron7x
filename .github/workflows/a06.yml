name: A06 raw benchmark evidence
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/model_rejection/**'
      - 'tests/model_rejection.test.mjs'
      - '.github/workflows/a06.yml'
  push:
    branches: [main]
    paths:
      - 'research/model_rejection/**'
      - 'tests/model_rejection.test.mjs'
      - '.github/workflows/a06.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - name: Reproduce A06 and preserve all catalog records
        shell: bash
        run: |
          node --test tests/model_rejection.test.mjs
          generator='import {run} from "./research/model_rejection/study.mjs"; console.log(JSON.stringify(run()))'
          dir="$RUNNER_TEMP/a06"
          mkdir "$dir"
          TZ=UTC node --input-type=module -e "$generator" > "$dir/results.json"
          TZ=Pacific/Honolulu node --input-type=module -e "$generator" > "$dir/repeat.json"
          cmp "$dir/results.json" "$dir/repeat.json"
          rm "$dir/repeat.json"
          git rev-parse HEAD > "$dir/commit.txt"
          (cd "$dir" && sha256sum results.json commit.txt > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a06-case-evidence
          path: ${{ runner.temp }}/a06
          if-no-files-found: error
          retention-days: 30
