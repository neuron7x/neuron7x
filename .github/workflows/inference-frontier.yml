name: A07 and A08 frontier evidence
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/inference_frontier/**'
      - 'tests/inference_frontier.test.mjs'
      - '.github/workflows/inference-frontier.yml'
  push:
    branches: [main]
    paths:
      - 'research/inference_frontier/**'
      - 'tests/inference_frontier.test.mjs'
      - '.github/workflows/inference-frontier.yml'
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - name: Reproduce the complete coverage and risk frontier
        shell: bash
        run: |
          node --test tests/inference_frontier.test.mjs
          generator='import {run} from "./research/inference_frontier/study.mjs"; import {run as a06} from "./research/model_rejection/study.mjs"; console.log(JSON.stringify(run(a06())))'
          dir="$RUNNER_TEMP/a07-a08"
          mkdir "$dir"
          TZ=UTC node --input-type=module -e "$generator" > "$dir/results.json"
          TZ=Pacific/Honolulu node --input-type=module -e "$generator" > "$dir/repeat.json"
          cmp "$dir/results.json" "$dir/repeat.json"
          rm "$dir/repeat.json"
          git rev-parse HEAD > "$dir/commit.txt"
          (cd "$dir" && sha256sum results.json commit.txt > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: a07-a08-frontier-evidence
          path: ${{ runner.temp }}/a07-a08
          if-no-files-found: error
          retention-days: 30
