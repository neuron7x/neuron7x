name: Exact evidence verification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event_name == 'pull_request' && '["pr-head","merge-preview"]' || '["commit"]') }}
    env:
      EXPECTED_SHA: ${{ matrix.target == 'pr-head' && github.event.pull_request.head.sha || github.sha }}
      REPORT_PATH: ${{ runner.temp }}/release-verification.json
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Select Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.16.0'
      - name: Select Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
      - name: Run offline proof and validate the report
        shell: bash
        run: |
          umask 022
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(node --version)" = v22.16.0
          test "$(python3 --version)" = 'Python 3.12.10'
          python3 -B tools/verify_release.py "$EXPECTED_SHA" --report "$REPORT_PATH"
          python3 -B - "$EXPECTED_SHA" "$(git rev-parse 'HEAD^{tree}')" "$REPORT_PATH" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          commit, tree, path = sys.argv[1:]
          with open(path, encoding="utf-8") as artifact:
              report = json.load(artifact)
          rows = report.get("checks", ())
          controls = [row for row in rows if row["kind"] == "negative-control"]
          expected_verifier = hashlib.sha256(Path("tools/verify_release.py").read_bytes()).hexdigest()
          if (report.get("schema") != "neuron7x.release-verification.v1"
                  or report.get("status") != "PASS"
                  or report.get("commit") != commit or report.get("tree") != tree
                  or report.get("verifier_sha256") != expected_verifier
                  or sum(row["kind"] == "check" for row in rows) < 5
                  or len(controls) < 16
                  or any(row["status"] != "PASS" or row["actual_exit"] != row["expected_exit"] for row in rows)):
              raise SystemExit("Incomplete or mismatched release proof")
          PY
      - name: Preserve the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.target }}-${{ env.EXPECTED_SHA }}-attempt-${{ github.run_attempt }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
          retention-days: 30
