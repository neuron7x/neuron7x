name: Exact evidence verification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event_name == 'pull_request' && '["pr-head","merge-preview"]' || '["commit"]') }}
    steps:
      - name: Resolve the event revision
        id: select
        env:
          TARGET: ${{ matrix.target }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ "$TARGET" == pr-head ]]; then sha="$PR_HEAD"; else sha="$EVENT_SHA"; fi
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.select.outputs.sha }}
          persist-credentials: false
      - name: Select Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - name: Select Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
      - name: Reproduce offline proof twice and compare reports
        env:
          EXPECTED_SHA: ${{ steps.select.outputs.sha }}
          REPORT_DIR: ${{ runner.temp }}/release-evidence
          GIT_NO_REPLACE_OBJECTS: '1'
          LC_ALL: C.UTF-8
        shell: bash
        run: |
          umask 022
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(node --version)" = v22.16.0
          test "$(python3 --version)" = 'Python 3.12.10'
          mkdir "$REPORT_DIR"
          first="$REPORT_DIR/release-verification.json"
          second="$REPORT_DIR/release-verification-repeat.json"
          PYTHONHASHSEED=1 TZ=UTC python3 -B tools/verify_release.py "$EXPECTED_SHA" --report "$first"
          PYTHONHASHSEED=271828 TZ=Pacific/Honolulu python3 -B tools/verify_release.py "$EXPECTED_SHA" --report "$second"
          python3 -B -m tools.check_release_reports "$EXPECTED_SHA" "$first" "$second"
      - name: Preserve the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.target }}-${{ steps.select.outputs.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-evidence/*.json
          if-no-files-found: error
          retention-days: 30
