name: Build theme-aware brain animation
on:
  push:
    branches: [visual/brain-theme-integration]
    paths:
      - tools/render_brain_transparency.py
      - .github/workflows/brain-themes.yml
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0 numpy==2.3.5
      - run: python tools/render_brain_transparency.py
      - name: Commit validated derivatives to the build branch
        run: |
          git add assets/neuro-code-dark.webp assets/neuro-code-light.webp assets/neuro-code-transparency.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Build verified theme-aware brain derivatives'
          git push origin HEAD:visual/brain-theme-integration
